version: '3.8'

services:
  besu-node:
    image: hyperledger/besu:24.12.2
    container_name: besu-pqc-node
    command:
      - --network=dev
      - --miner-enabled
      - --miner-coinbase=0xfe3b557e8fb62b89f4916b721be55ceb828dbd73
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,EEA
      - --host-allowlist=*
      - --rpc-http-cors-origins=*
      - --data-path=/data
    ports:
      - "8545:8545"
    volumes:
      - ./data:/data
    restart: unless-stopped
