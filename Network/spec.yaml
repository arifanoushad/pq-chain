fabric:
  cas:
    - "ca1.PoliceOrg.evidence.com"  # Certificate Authority for PoliceOrg
    - "ca1.CourtOrg.evidence.com"   # Certificate Authority for CourtOrg

  peers:
    - "peer1.PoliceOrg.evidence.com"  # Peer for PoliceOrg
    - "peer1.CourtOrg.evidence.com"   # Peer for CourtOrg

  orderers:
    - "orderer1.evidence.com"  # First orderer
    - "orderer2.evidence.com"  # Second orderer
    - "orderer3.evidence.com"  # Third orderer

  channels:
    - name: evidencechannel
      orderers:
        - "orderer1.evidence.com"  # Orderer 1
        - "orderer2.evidence.com"  # Orderer 2
        - "orderer3.evidence.com"  # Orderer 3
      members:
        - "PoliceOrg"  # Channel member - PoliceOrg
        - "CourtOrg"   # Channel member - CourtOrg

  settings:
    ca:
      FABRIC_LOGGING_SPEC: DEBUG  # Set logging level for CA
    peer:
      FABRIC_LOGGING_SPEC: DEBUG  # Set logging level for Peers
    orderer:
      FABRIC_LOGGING_SPEC: DEBUG  # Set logging level for Orderers

  identity_management:
    - role: "Provider"
      msp_id: "PoliceOrgMSP"  # MSP for PoliceOrg
    - role: "Requester"
      msp_id: "CourtOrgMSP"   # MSP for CourtOrg
    - role: "Validator"
      msp_id: "CourtOrgMSP"   # MSP for CourtOrg (assuming it's also a validator)

